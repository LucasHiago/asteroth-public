name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy directory
        env:
          # URL do backend (Settings > Secrets and variables > Actions > Variables).
          # So alimenta window.ASTEROTH_API — os grids de governantes/sub-governantes
          # hidratam por ela. As imagens sao locais (site/img, geradas por
          # scripts/build-webp.py), nao dependem do host.
          ASSET_HOST: ${{ vars.ASSET_HOST }}
        run: |
          set -e
          mkdir -p _deploy
          cp -r site/. _deploy/
          # symlink de dev (site/concepts -> ../../asteroth-assets/concepts): so o
          # build-webp.py usa, nao vai pro ar.
          rm -rf _deploy/concepts
          if [ -n "$ASSET_HOST" ]; then
            find _deploy -maxdepth 1 -name '*.html' -print0 \
              | xargs -0 sed -i "s#<head>#<head><script>window.ASTEROTH_API=\"${ASSET_HOST}\";</script>#"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
